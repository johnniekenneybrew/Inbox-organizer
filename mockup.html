<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gmail Label Tabs + Hold — Mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', Roboto, Arial, sans-serif; }
    body { background: #f6f8fc; color: #202124; }

    .header { display: flex; align-items: center; height: 64px; padding: 0 16px; gap: 16px; background: #f6f8fc; }
    .menu-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .menu-btn svg { width: 24px; height: 24px; fill: #5f6368; }
    .gmail-logo { display: flex; align-items: center; gap: 8px; }
    .gmail-logo span { font-size: 22px; color: #5f6368; }
    .search { flex: 1; max-width: 720px; height: 48px; background: #eaf1fb; border-radius: 8px; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
    .search svg { width: 20px; height: 20px; fill: #5f6368; }
    .search input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; }
    .header-spacer { flex: 1; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a73e8; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; }

    .body { display: flex; height: calc(100vh - 64px); }
    .sidebar { width: 256px; padding: 8px; overflow-y: auto; }
    .compose { display: flex; align-items: center; gap: 16px; padding: 16px; margin: 8px 8px 16px; background: #c2e7ff; border-radius: 16px; cursor: pointer; font-weight: 500; }
    .compose-icon { width: 24px; height: 24px; }
    .nav-item { display: flex; align-items: center; gap: 16px; padding: 0 12px 0 26px; height: 32px; border-radius: 0 16px 16px 0; cursor: pointer; font-size: 14px; color: #202124; }
    .nav-item:hover { background: #e8eaed; }
    .nav-item.active { background: #d3e3fd; font-weight: 700; }
    .nav-item .count { margin-left: auto; font-size: 12px; }
    .nav-icon { width: 20px; height: 20px; fill: #5f6368; flex-shrink: 0; }
    .labels-header { padding: 16px 12px 4px 26px; font-size: 14px; color: #202124; display: flex; align-items: center; justify-content: space-between; }
    .label-dot { width: 12px; height: 12px; border-radius: 2px; }
    .dot-followup { background: #1a73e8; } .dot-todo { background: #d93025; } .dot-watch { background: #f9ab00; } .dot-hold { background: #9aa0a6; }

    .main { flex: 1; background: #fff; border-radius: 16px 0 0 0; margin: 0 8px 8px 0; overflow: hidden; display: flex; flex-direction: column; position: relative; }

    /* Tab bar */
    .glt-bar { display: flex; align-items: stretch; gap: 4px; padding: 0 12px; background: #fff; border-bottom: 1px solid #e0e0e0; min-height: 48px; flex-shrink: 0; }
    .glt-tab { background: transparent; border: none; cursor: pointer; padding: 0 16px; font-size: 14px; color: #5f6368; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; font-family: inherit; }
    .glt-tab:hover { color: #202124; background: #f1f3f4; }
    .glt-tab.active { color: #1a73e8; font-weight: 600; border-bottom: 3px solid #1a73e8; }

    .glt-right { margin-left: auto; display: flex; align-items: center; gap: 6px; padding-left: 8px; }

    /* Contextual action (Hold / Return now) */
    .glt-hold { display: none; align-items: center; gap: 6px; align-self: center; height: 32px; padding: 0 14px; font-size: 13px; font-weight: 500; color: #1a73e8; background: transparent; border: 1px solid #dadce0; border-radius: 16px; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .glt-hold.show { display: inline-flex; }
    .glt-hold:hover { background: #e8f0fe; border-color: #1a73e8; }
    .glt-hold svg { width: 16px; height: 16px; }

    /* Hold navigation tab */
    .glt-hold-tab { display: inline-flex; align-items: center; gap: 6px; align-self: center; height: 32px; padding: 0 14px; font-size: 13px; font-weight: 500; color: #5f6368; background: #f1f3f4; border: none; border-radius: 16px; cursor: pointer; font-family: inherit; }
    .glt-hold-tab:hover { background: #e8eaed; color: #202124; }
    .glt-hold-tab.active { background: #e8f0fe; color: #1a73e8; }
    .glt-hold-tab-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #1a73e8; color: #fff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }

    .glt-gear { align-self: center; background: transparent; border: none; cursor: pointer; color: #5f6368; display: flex; align-items: center; padding: 0 8px; }
    .glt-gear:hover { color: #1a73e8; }
    .glt-gear svg { width: 18px; height: 18px; fill: currentColor; }

    /* Inline row button */
    .glt-row-hold { position: fixed; z-index: 70; display: none; align-items: center; gap: 6px; height: 28px; padding: 0 12px; font-size: 12px; font-weight: 500; color: #1a73e8; background: #fff; border: 1px solid #dadce0; border-radius: 14px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.18); font-family: inherit; }
    .glt-row-hold.show { display: inline-flex; }
    .glt-row-hold:hover { background: #e8f0fe; border-color: #1a73e8; }
    .glt-row-hold svg { width: 15px; height: 15px; }

    /* Duration popover */
    .glt-pop { position: absolute; z-index: 80; min-width: 210px; background: #fff; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,.14), 0 1px 14px rgba(0,0,0,.12); padding: 8px; display: none; }
    .glt-pop.show { display: block; }
    .glt-pop-title { margin: 4px 8px 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: #5f6368; }
    .glt-pop-opt { display: block; width: 100%; text-align: left; background: transparent; border: none; cursor: pointer; padding: 9px 12px; font-size: 14px; color: #202124; border-radius: 6px; font-family: inherit; }
    .glt-pop-opt:hover { background: #f1f3f4; color: #1a73e8; }
    .glt-pop-opt--custom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .glt-pop-rm { color: #9aa0a6; font-size: 12px; padding: 2px 4px; border-radius: 4px; }
    .glt-pop-rm:hover { background: #e8eaed; color: #c5221f; }
    .glt-pop-custom { display: flex; align-items: center; gap: 6px; margin-top: 6px; padding: 8px 4px 4px; border-top: 1px solid #e0e0e0; }
    .glt-pop-amt { width: 52px; font-size: 13px; padding: 5px; border: 1px solid #dadce0; border-radius: 6px; }
    .glt-pop-unit { flex: 1; min-width: 0; font-size: 13px; padding: 5px; border: 1px solid #dadce0; border-radius: 6px; background: #fff; }
    .glt-pop-cgo { background: transparent; border: none; cursor: pointer; font-size: 13px; font-weight: 500; color: #1a73e8; padding: 5px 10px; border-radius: 6px; font-family: inherit; }
    .glt-pop-cgo:hover { background: #e8f0fe; }
    .glt-pop-sub { margin: 4px 8px 2px; font-size: 12px; color: #5f6368; }
    .glt-pop-date { display: flex; align-items: center; gap: 6px; padding: 2px 4px 4px; }
    .glt-pop-dt { flex: 1; min-width: 0; font-size: 13px; padding: 5px; border: 1px solid #dadce0; border-radius: 6px; }

    /* Toolbar + list */
    .toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 16px; border-bottom: 1px solid #f1f3f4; }
    .tb-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #5f6368; }
    .tb-btn:hover { background: #f1f3f4; }
    .tb-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .toolbar-spacer { flex: 1; }
    .pagination { font-size: 12px; color: #5f6368; }
    .view-banner { padding: 6px 16px; font-size: 13px; color: #5f6368; background: #f8f9fa; border-bottom: 1px solid #f1f3f4; }

    .email-list { flex: 1; overflow-y: auto; }
    .email-row { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; height: 44px; border-bottom: 1px solid #f1f3f4; cursor: pointer; font-size: 14px; }
    .email-row:hover { box-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px 0 rgba(60,64,67,.3); z-index: 1; position: relative; }
    .email-row.unread { background: #f2f6fc; font-weight: 700; }
    .email-row.unread .sender, .email-row.unread .subject-line { color: #202124; }
    .row-check { width: 18px; height: 18px; border: 2px solid #5f6368; border-radius: 2px; flex-shrink: 0; }
    .row-star svg { width: 18px; height: 18px; fill: #dadce0; }
    .sender { width: 168px; color: #5f6368; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .subject-line { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5f6368; }
    .when { width: 120px; text-align: right; color: #5f6368; font-size: 12px; }
    .date { width: 64px; text-align: right; color: #5f6368; font-size: 12px; }

    /* Conversation */
    .convo { flex: 1; overflow-y: auto; display: none; }
    .convo.show { display: block; }
    .convo-toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 16px; border-bottom: 1px solid #f1f3f4; }
    .convo-body { padding: 20px 32px; }
    .convo-subject { font-size: 22px; font-weight: 400; margin-bottom: 18px; }
    .convo-msg { display: flex; gap: 16px; }
    .convo-av { width: 40px; height: 40px; border-radius: 50%; background: #7e57c2; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; flex-shrink: 0; }
    .convo-from { font-size: 14px; font-weight: 700; }
    .convo-to { font-size: 12px; color: #5f6368; }
    .convo-text { margin-top: 14px; font-size: 14px; line-height: 1.7; }
    .convo-date { margin-left: auto; font-size: 12px; color: #5f6368; }
    .convo-actions { margin: 0 32px 16px; }
    .convo-return { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 16px; font-size: 13px; font-weight: 500; color: #1a73e8; background: #e8f0fe; border: 1px solid #d2e3fc; border-radius: 17px; cursor: pointer; font-family: inherit; }
    .convo-return svg { width: 16px; height: 16px; }

    .glt-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 95; background: #202124; color: #fff; font-size: 13px; padding: 12px 20px; border-radius: 8px; box-shadow: 0 3px 5px rgba(0,0,0,.2); display: none; }
    .glt-toast.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="menu-btn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
    <div class="gmail-logo">
      <svg width="40" height="32" viewBox="0 0 256 193"><path fill="#4285F4" d="M58.182 192.05V93.14L27.507 65.077 0 49.504v125.091c0 9.658 7.825 17.455 17.455 17.455z"/><path fill="#34A853" d="M197.818 192.05h40.727c9.659 0 17.455-7.826 17.455-17.455V49.505l-31.156 17.837-27.026 25.798z"/><path fill="#EA4335" d="M58.182 93.14L54.025 54.65l4.157-36.69L128 70.45l69.818-52.49 4.65 33.495-4.65 41.685L128 145.63z"/><path fill="#FBBC04" d="M197.818 17.96V93.14L256 49.505V26.96c0-20.793-23.723-32.665-40.364-20.19z"/><path fill="#C5221F" d="M0 49.505l26.759 20.07L58.182 93.14V17.96L40.364 6.77C23.694-5.706 0 6.166 0 26.96z"/></svg>
      <span>Gmail</span>
    </div>
    <div class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="search-box" type="text" placeholder="Search mail"></div>
    <div class="header-spacer"></div>
    <div class="avatar">J</div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="compose"><svg class="compose-icon" viewBox="0 0 24 24"><path fill="#001d35" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Compose</div>
      <div class="nav-item active" data-tab="INBOX"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z"/></svg>Inbox <span class="count" id="inbox-count"></span></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>Starred</div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>Sent</div>
      <div class="labels-header"><span>Labels</span><span>+</span></div>
      <div class="nav-item" data-tab="Follow Up"><span class="label-dot dot-followup"></span>Follow Up</div>
      <div class="nav-item" data-tab="To Do"><span class="label-dot dot-todo"></span>To Do</div>
      <div class="nav-item" data-tab="Hold"><span class="label-dot dot-hold"></span><span id="sidebar-hold-name">Hold</span> <span class="count" id="sidebar-hold-count"></span></div>
    </div>

    <div class="main">
      <div class="glt-bar" id="glt-bar">
        <button class="glt-tab active" data-tab="INBOX">Inbox</button>
        <button class="glt-tab" data-tab="Follow Up">Follow Up</button>
        <button class="glt-tab" data-tab="To Do">To Do</button>
        <div class="glt-right">
          <button class="glt-hold" id="glt-hold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span class="glt-hold-label">Hold</span></button>
          <button class="glt-hold-tab" id="glt-hold-tab"><span class="glt-hold-tab-label">Hold</span><span class="glt-hold-tab-count" id="glt-hold-tab-count"></span></button>
          <button class="glt-gear" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.28 7.28 0 00-1.62-.94l-.36-2.54A.48.48 0 0014 3h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 00-.59.22L2.74 9.47a.48.48 0 00.12.61l2.03 1.58a7.44 7.44 0 000 1.88l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
        </div>
      </div>

      <div id="list-view" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
        <div class="toolbar">
          <div class="tb-btn"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm0 16H5V5h14v14z"/></svg></div>
          <div class="tb-btn"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></div>
          <div class="toolbar-spacer"></div>
          <span class="pagination" id="pagination"></span>
        </div>
        <div class="view-banner" id="view-banner" style="display:none"></div>
        <div class="email-list" id="email-list"></div>
      </div>

      <div class="convo" id="convo-view">
        <div class="convo-toolbar">
          <div class="tb-btn" id="convo-back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
          <div class="tb-btn"><svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4v2h16V5zm-1 14H5V8h14v11z"/></svg></div>
        </div>
        <div class="convo-actions" id="convo-actions" style="display:none">
          <button class="convo-return" id="convo-return"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"></path><path d="M5 10h11a4 4 0 0 1 0 8h-1"></path></svg>Return to inbox now</button>
        </div>
        <div class="convo-body" id="convo-body"></div>
      </div>

      <div class="glt-pop" id="glt-pop">
        <p class="glt-pop-title">Return to inbox in…</p>
        <div id="glt-pop-opts"></div>
        <div class="glt-pop-custom">
          <input type="number" min="1" class="glt-pop-amt" id="glt-pop-amt" placeholder="#">
          <select class="glt-pop-unit" id="glt-pop-unit"><option value="hours">hours</option><option value="days" selected>days</option><option value="weeks">weeks</option></select>
          <button class="glt-pop-cgo" id="glt-pop-cgo">Hold</button>
        </div>
        <p class="glt-pop-sub">Or on a specific date</p>
        <div class="glt-pop-date">
          <input type="datetime-local" class="glt-pop-dt" id="glt-pop-dt">
          <button class="glt-pop-cgo" id="glt-pop-dgo">Set</button>
        </div>
      </div>
    </div>
  </div>

  <button class="glt-row-hold" id="glt-row-hold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span class="glt-row-hold-label">Hold</span></button>
  <div class="glt-toast" id="glt-toast"></div>

  <script>
    const UNIT_MS = { hours: 3600e3, days: 864e5, weeks: 6048e5 };
    const DEFAULT_PRESETS = [ { label: '3 days' }, { label: '1 week' } ];
    let customDurations = [ { label: '2 weeks', amount: 2, unit: 'weeks' } ]; // seeded to show the cache

    const INBOX = [
      { id:'m1', sender:'Sam Lee', from:'sam.lee@northwind.com', date:'Jun 08', unread:true, subject:'Contract — need your sign-off', preview:'Attaching the final contract. Could you review and sign by Thursday…', body:'Attaching the final contract for the Q3 engagement. Could you review and send your sign-off by Thursday so we keep the start date on track?\n\nThanks,\nSam' },
      { id:'m2', sender:'Jordan Patel', from:'jordan@brightlabs.io', date:'Jun 07', unread:false, subject:'Re: Invoice #2041', preview:'Thanks for the reminder — I\'ll route this to accounts payable this week…', body:'Thanks for the reminder — I\'ll route this to accounts payable this week and confirm once scheduled.\n\nJordan' },
      { id:'m3', sender:'Taylor Reed', from:'taylor.reed@vectorhq.com', date:'Jun 06', unread:false, subject:'Partnership intro', preview:'Great meeting you! I\'d love to set up time to explore how our teams…', body:'Great meeting you at the conference!\n\nCould we set up a 30-minute intro call next week?\n\nCheers,\nTaylor' },
    ];
    // Pre-held items so the Hold tab + view are populated.
    const HELD = [
      { id:'h1', sender:'Dana Cruz', from:'dana@acme.co', date:'Jun 05', unread:false, subject:'Renewal quote follow-up', preview:'Just checking in on the renewal quote we sent over last week…', when:'in 3 days', body:'Just checking in on the renewal quote we sent over last week — let me know if you have questions.\n\nDana' },
      { id:'h2', sender:'Morgan Yu', from:'morgan@finchpay.com', date:'Jun 04', unread:false, subject:'Re: Statement of work', preview:'Sounds good — I\'ll get the SOW signed and back to you shortly…', when:'in 1 week', body:'Sounds good — I\'ll get the SOW signed and back to you shortly.\n\nMorgan' },
    ];

    let currentTab = 'INBOX';
    let openId = null;
    const removed = new Set();
    const $ = (id) => document.getElementById(id);

    function inboxRows() { return INBOX.filter(r => !removed.has(r.id)); }
    function rowsFor(tab) { return tab === 'Hold' ? HELD : inboxRows(); }

    function renderList() {
      const rows = rowsFor(currentTab);
      const banner = $('view-banner');
      if (currentTab === 'Hold') {
        banner.style.display = ''; banner.textContent = 'Hold — emails waiting to return to your inbox. Hover a row to return it now.';
      } else banner.style.display = 'none';
      $('pagination').textContent = rows.length ? `1–${rows.length} of ${rows.length}` : '0 of 0';
      $('inbox-count').textContent = inboxRows().length || '';
      $('email-list').innerHTML = rows.length ? rows.map(r => `
        <div class="email-row${r.unread ? ' unread' : ''}" data-id="${r.id}">
          <div class="row-check"></div>
          <div class="row-star"><svg viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03z"/></svg></div>
          <div class="sender">${r.sender}</div>
          <div class="subject-line"><span>${r.subject}</span> — <span style="font-weight:400">${r.preview}</span></div>
          ${currentTab === 'Hold' ? `<div class="when">↩ ${r.when}</div>` : `<div class="date">${r.date}</div>`}
        </div>`).join('') : `<div style="padding:60px;text-align:center;color:#5f6368">No conversations.</div>`;
      $('email-list').querySelectorAll('.email-row').forEach(row =>
        row.addEventListener('click', () => openConversation(row.dataset.id)));
    }

    function updateBar() {
      document.querySelectorAll('.glt-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
      const holdTab = $('glt-hold-tab');
      holdTab.classList.toggle('active', currentTab === 'Hold');
      $('glt-hold-tab-count').textContent = HELD.length || '';
      $('glt-hold-tab-count').style.display = HELD.length ? '' : 'none';
      $('sidebar-hold-count').textContent = HELD.length || '';
      // bar action button only shows when an email is open
      $('glt-hold').classList.toggle('show', !!openId);
    }

    function openConversation(id) {
      const inHold = currentTab === 'Hold';
      const m = (inHold ? HELD : INBOX).find(x => x.id === id);
      if (!m) return;
      openId = id;
      $('list-view').style.display = 'none';
      $('convo-view').classList.add('show');
      $('convo-actions').style.display = inHold ? '' : 'none';
      $('convo-body').innerHTML = `
        <div class="convo-subject">${m.subject}</div>
        <div class="convo-msg"><div class="convo-av">${m.sender[0]}</div><div style="flex:1">
          <div style="display:flex"><div><div class="convo-from">${m.sender} &lt;${m.from}&gt;</div><div class="convo-to">to me</div></div><div class="convo-date">${m.date}, 9:14 AM</div></div>
          <div class="convo-text">${m.body.replace(/\n/g,'<br>')}</div>
        </div></div>`;
      // In the inbox an open email shows "Hold"; in the Hold view it shows "Return now".
      $('glt-hold').querySelector('.glt-hold-label').textContent = inHold ? 'Return now' : 'Hold';
      $('glt-hold').dataset.mode = inHold ? 'return' : 'hold';
      updateBar();
    }
    function backToList() { openId = null; $('convo-view').classList.remove('show'); $('list-view').style.display = 'flex'; closePop(); updateBar(); }
    $('convo-back').addEventListener('click', backToList);
    $('convo-return').addEventListener('click', () => returnNow(openId));

    // Picker
    const pop = $('glt-pop');
    let holdTargetId = null;
    function renderPopOpts() {
      const opts = [...DEFAULT_PRESETS.map(p => ({label:p.label, custom:false})),
                    ...customDurations.map((c,i) => ({label:c.label, custom:true, i}))];
      $('glt-pop-opts').innerHTML = opts.map(o => o.custom
        ? `<button class="glt-pop-opt glt-pop-opt--custom" data-label="${o.label}"><span>${o.label}</span><span class="glt-pop-rm" data-rm="${o.i}">✕</span></button>`
        : `<button class="glt-pop-opt" data-label="${o.label}">${o.label}</button>`).join('');
      $('glt-pop-opts').querySelectorAll('.glt-pop-opt').forEach(b =>
        b.addEventListener('click', (e) => { if (e.target.classList.contains('glt-pop-rm')) return; commitHold(b.dataset.label); }));
      $('glt-pop-opts').querySelectorAll('.glt-pop-rm').forEach(rm =>
        rm.addEventListener('click', (e) => { e.stopPropagation(); customDurations.splice(+rm.dataset.rm,1); renderPopOpts(); }));
    }
    function openPopAt(anchorEl, targetId) {
      holdTargetId = targetId;
      renderPopOpts();
      const main = document.querySelector('.main').getBoundingClientRect();
      const a = anchorEl.getBoundingClientRect();
      pop.classList.add('show');
      pop.style.top = (a.bottom - main.top + 6) + 'px';
      pop.style.left = Math.max(8, a.right - main.left - pop.offsetWidth) + 'px';
    }
    function closePop() { pop.classList.remove('show'); }
    $('glt-hold').addEventListener('click', () => {
      if ($('glt-hold').dataset.mode === 'return') return returnNow(openId);
      pop.classList.contains('show') ? closePop() : openPopAt($('glt-hold'), openId);
    });
    $('glt-pop-cgo').addEventListener('click', () => {
      const amt = parseInt($('glt-pop-amt').value, 10); const unit = $('glt-pop-unit').value;
      if (!amt || amt < 1) return;
      const label = `${amt} ${amt===1?unit.replace(/s$/,''):unit}`;
      customDurations = [{label,amount:amt,unit}, ...customDurations.filter(x=>x.label!==label)].slice(0,6);
      commitHold(label);
    });
    $('glt-pop-dgo').addEventListener('click', () => {
      const v = $('glt-pop-dt').value; if (!v) return;
      commitHold(new Date(v).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}));
    });

    function commitHold(whenLabel) {
      closePop();
      const m = INBOX.find(x => x.id === holdTargetId) || HELD.find(x => x.id === holdTargetId);
      if (!m) return;
      if (!removed.has(m.id)) removed.add(m.id);
      if (!HELD.find(h => h.id === m.id)) HELD.push({ ...m, when: whenLabel });
      $('glt-row-hold').classList.remove('show');
      toast(`Held — returns ${whenLabel}`);
      if (openId) backToList();
      renderList(); updateBar();
    }
    function returnNow(id) {
      removed.delete(id);
      const i = HELD.findIndex(h => h.id === id); if (i > -1) HELD.splice(i,1);
      toast('Returned to inbox — marked unread');
      if (openId) backToList();
      renderList(); updateBar();
    }

    // Inline row button (Hold in inbox, Return now in Hold view)
    const rowBtn = $('glt-row-hold'); let rowTargetId = null, rowHideT;
    function showRowBtn(row) {
      rowTargetId = row.dataset.id;
      const ret = currentTab === 'Hold';
      rowBtn.dataset.mode = ret ? 'return' : 'hold';
      rowBtn.querySelector('.glt-row-hold-label').textContent = ret ? 'Return now' : 'Hold';
      const r = row.getBoundingClientRect();
      rowBtn.classList.add('show');
      rowBtn.style.top = (r.top + r.height/2 - 14) + 'px';
      rowBtn.style.left = (r.right - rowBtn.offsetWidth - 80) + 'px';
    }
    function hideRowSoon() { clearTimeout(rowHideT); rowHideT = setTimeout(() => { if (!pop.classList.contains('show')) rowBtn.classList.remove('show'); }, 250); }
    $('email-list').addEventListener('mouseover', e => { const row = e.target.closest('.email-row'); if (row) { clearTimeout(rowHideT); showRowBtn(row); } });
    $('email-list').addEventListener('mouseout', e => { if (!e.relatedTarget?.closest?.('.email-row') && e.relatedTarget !== rowBtn) hideRowSoon(); });
    rowBtn.addEventListener('mouseenter', () => clearTimeout(rowHideT));
    rowBtn.addEventListener('mouseleave', hideRowSoon);
    rowBtn.addEventListener('click', () => { if (rowBtn.dataset.mode === 'return') returnNow(rowTargetId); else openPopAt(rowBtn, rowTargetId); });

    function toast(msg) { const el = $('glt-toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(window._t); window._t = setTimeout(() => el.classList.remove('show'), 3500); }

    function switchTab(tab) { currentTab = tab; backToList(); document.querySelectorAll('.nav-item[data-tab]').forEach(n => n.classList.toggle('active', n.dataset.tab === tab)); renderList(); updateBar(); }
    document.querySelectorAll('.glt-tab[data-tab], .nav-item[data-tab]').forEach(el => el.addEventListener('click', () => switchTab(el.dataset.tab)));
    $('glt-hold-tab').addEventListener('click', () => switchTab('Hold'));

    renderList(); updateBar();

    window.__demo = {
      openInboxPicker(id) { const row = document.querySelector(`.email-row[data-id="${id}"]`); if (row) { showRowBtn(row); openPopAt(rowBtn, id); } },
      gotoHold() { switchTab('Hold'); },
      hoverReturn(id) { const row = document.querySelector(`.email-row[data-id="${id}"]`); if (row) showRowBtn(row); },
      openHeld(id) { switchTab('Hold'); openConversation(id); },
    };
  </script>
</body>
</html>
