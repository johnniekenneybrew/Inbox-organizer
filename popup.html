<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inbox Genie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 14px;
      color: #202124;
      width: 260px;
      padding: 20px 20px 16px;
      line-height: 1.5;
    }

    h1 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 14px;
    }

    .open-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 140ms ease;
    }

    .open-btn:hover { background: #1765cc; }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #80868b;
    }
  </style>
</head>
<body>
  <h1>Inbox Genie</h1>
  <p>Pinned label tabs appear at the top of your inbox for instant navigation, plus a <strong>Hold</strong> button to snooze emails out of the inbox and bring them back on a timer.</p>

  <a class="open-btn" href="https://mail.google.com" target="_blank">Open Gmail</a>

  <p class="hint">Use <strong>&#x2699;</strong> to add or reorder labels, and <strong>Hold</strong> on an open email to snooze it.</p>
</body>
</html>
